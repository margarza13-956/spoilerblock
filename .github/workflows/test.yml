name: Test Suite & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Automated Test Suite
        run: node test-suite.js

      - name: Verify Package Script
        run: |
          chmod +x ./package.sh
          ./package.sh
